<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications - BBMS Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="design/style.css?v=2">
<style>
  .notif-tabs{display:flex; gap:8px; margin-bottom:18px;}
  .notif-tab{padding:9px 18px; border-radius:9px; font-size:13px; font-weight:600; color:var(--text-mid); background:#fff; border:1.5px solid var(--border); cursor:pointer;}
  .notif-tab.active{background:var(--red-600); color:#fff; border-color:var(--red-600);}
  .notif-item{display:flex; gap:14px; padding:18px 22px; border-bottom:1px solid var(--border); position:relative;}
  .notif-item:last-child{border-bottom:none;}
  .notif-item.unread{background:#fef9f9;}
  .notif-icon{width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:18px;}
  .notif-icon.critical{background:var(--red-50); color:var(--red-600);}
  .notif-icon.info{background:#eef2ff; color:#4338ca;}
  .notif-icon.success{background:#eafaf0; color:var(--green);}
  .notif-icon.warning{background:#fff7e6; color:var(--amber);}
  .notif-body{flex:1; min-width:0;}
  .notif-title{font-size:13.5px; font-weight:600; margin-bottom:3px;}
  .notif-desc{font-size:12.5px; color:var(--text-mid); line-height:1.5;}
  .notif-time{font-size:11.5px; color:var(--text-light); margin-top:6px;}
  .notif-dot{width:8px; height:8px; border-radius:50%; background:var(--red-600); flex-shrink:0; margin-top:6px;}
</style>
</head>
<body>

<div class="app">
  <div class="sidebar-overlay" id="overlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">

      </div>
      <div class="logo-text">
        <div class="brand">BBMS</div>
        <div class="sub">Blood Bank Management System</div>
      </div>
    </div>
    <ul class="nav-list">
      <li><a href="dashboard.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        Dashboard
      </a></li>
      <li><a href="donors.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><circle cx="17.5" cy="9" r="2.4"/><path d="M15.5 13.2c2.7.2 4.7 2.4 4.7 5.3"/></svg>
        Donors
      </a></li>
      <li><a href="blood-inventory.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3s6.5 7 6.5 11.5a6.5 6.5 0 0 1-13 0C5.5 10 12 3 12 3Z"/></svg>
        Blood Inventory
      </a></li>
      <li><a href="blood-requests.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 2.5v3M16 2.5v3M4 9.5h16"/></svg>
        Blood Requests
      </a></li>
      <li><a href="hospitals.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 21V9l8-5 8 5v12"/><path d="M9 21v-6h6v6M4 21h16"/></svg>
        Hospitals
      </a></li>
      <li><a href="reports.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="3.5" height="10"/><rect x="10.3" y="6" width="3.5" height="14"/><rect x="16.5" y="3" width="3.5" height="17"/></svg>
        Reports
      </a></li>
      <li><a href="settings.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 13.5c.05-.5.05-1 0-1.5l1.9-1.3-2-3.5-2.2.7c-.4-.3-.9-.6-1.3-.8L15.4 5h-4l-.4 2.1c-.5.2-.9.5-1.3.8L7.5 7.2l-2 3.5 1.9 1.3c-.05.5-.05 1 0 1.5l-1.9 1.3 2 3.5 2.2-.7c.4.3.9.6 1.3.8L11.4 21h4l.4-2.1c.5-.2.9-.5 1.3-.8l2.2.7 2-3.5-1.9-1.3Z"/></svg>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>

    <div class="sidebar-footer">
      <div class="copyright">© 2026 BBMS. All rights reserved.</div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="burger">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <h1>Notifications</h1>
      <div class="topbar-right">
        <a href="adnotification.html" class="bell-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="badge-dot" id="bellCount" style="display:none;"></span>
        </a>
        <div class="profile">
          <span class="avatar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
          </span>
          <span class="admin-name">Admin</span>
        </div>
      </div>
    </header>

    <div class="content">
      <div class="page-head">
        <div>
          <h2>Notifications</h2>
          <p>Stay on top of requests, stock levels, and donor activity</p>
        </div>
        <button class="btn btn-outline" onclick="markAllRead()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
          Mark all as read
        </button>
      </div>

      <div class="notif-tabs">
        <div class="notif-tab active" data-filter="all" onclick="setFilter('all', this)">All</div>
        <div class="notif-tab" data-filter="unread" onclick="setFilter('unread', this)">Unread</div>
      </div>

      <div class="table-card">
        <div id="notifList"></div>
      </div>
    </div>
  </div>
</div>

<script src="design/site.js?v=2"></script>
<script>
  let notifications = [];

  const icons = {
    critical: '🚨', warning: '⚠️', info: 'ℹ️', success: '✅'
  };

  let currentFilter = 'all';

  function loadNotifications() {
    fetch('../api/notifications/notifications.php')
      .then(readJson)
      .then(data => {
        notifications = Array.isArray(data) ? data : [];
        render();
        updateBellCount();
      })
      .catch(() => {
        document.getElementById('notifList').innerHTML =
          '<div class="empty-state">Could not load notifications.</div>';
      });
  }

  function updateBellCount() {
    updateBellBadge(notifications.filter(n => n.is_read == 0).length);
  }

  function render() {
    const list = document.getElementById('notifList');
    const filtered = currentFilter === 'unread'
      ? notifications.filter(n => n.is_read == 0)
      : notifications;

    if (filtered.length === 0) {
      list.innerHTML = '<div class="empty-state">No notifications here.</div>';
      return;
    }

    list.innerHTML = filtered.map(n => `
      <div class="notif-item ${n.is_read == 0 ? 'unread' : ''}" onclick="markRead(${n.id})">
        <div class="notif-icon ${n.type}">${icons[n.type]}</div>
        <div class="notif-body">
          <div class="notif-title">${escapeHtml(n.title)}</div>
          <div class="notif-desc">${escapeHtml(n.message)}</div>
          <div class="notif-time">${timeAgo(n.created_at)}</div>
        </div>
        ${n.is_read == 0 ? '<div class="notif-dot"></div>' : ''}
      </div>
    `).join('');
  }

  function markRead(id) {
    const n = notifications.find(x => x.id == id);
    if (!n || n.is_read == 1) return;
    fetch('../api/notifications/notifications.php?id=' + id, { method: 'PUT' })
      .then(() => {
        n.is_read = 1;
        render();
        updateBellCount();
      });
  }

  function markAllRead() {
    fetch('../api/notifications/notifications.php', { method: 'PUT' })
      .then(() => {
        notifications.forEach(n => n.is_read = 1);
        render();
        updateBellCount();
      });
  }

  function setFilter(filter, el) {
    currentFilter = filter;
    document.querySelectorAll('.notif-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    render();
  }

  function initPage() {
    loadNotifications();
  }
</script>
</body>
</html>
